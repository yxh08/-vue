<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
  </head>
  <body>
    <div id="app"></div>
    <button id="btn">++</button>
    <script type="module">
      // import {
      //   createRenderer,
      //   ref,
      //   h,
      //   createApp,
      //   reactive,
      // } from '../../../node_modules/vue/dist/vue.esm-browser.js'
      import {
        renderOptions,
        createRenderer,
        render,
        h,
        ref,
        reactive,
        createApp,
      } from '../dist/vue.esm.js'

      const Comp = {
        props: {
          test: String,
        },
        setup(props, { attrs }) {
          console.log('props ===>', props)
          const count = ref(1)
          const age = ref(18)
          const info = reactive({ address: 'hz' })

          btn.addEventListener('click', () => {
            count.value++
          })

          return {
            count,
            age,
            info,
          }
        },
        render() {
          return h(
            'div',
            {
              style: {
                height: '100px',
                padding: '10px',
                width: 'fit-content',
                display: 'flex',
                justifyContent: 'center',
                gap: '10px',
                flexDirection: 'column',
              },
            },
            h(
              'span',
              {
                onClick: () => {
                  console.log('this', this)
                  this.count++
                },
              },
              `无setup :${this.count}`,
            ),
          )
        },
      }

      const app = createApp(Comp, {
        test: 'testvalue',
        style: { border: '1px solid green' },
      })
      app.mount('#app')
    </script>
  </body>
</html>

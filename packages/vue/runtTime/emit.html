<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>emit</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // import {
      //   createRenderer,
      //   ref,
      //   h,
      //   createApp,
      //   reactive,
      //   effect,
      //   watch,
      // } from '../../../node_modules/vue/dist/vue.esm-browser.js'
      import {
        renderOptions,
        createRenderer,
        render,
        h,
        ref,
        reactive,
        createApp,
        nextTick,
      } from '../dist/vue.esm.js'

      const child = {
        setup(props, { emit }) {
          return function () {
            return h(
              'button',
              {
                onClick: () => {
                  // console.log(emit)
                  this.$emit('foo', 123, 456, 789)
                },
              },
              '我是子组件',
            )
          }
        },
      }

      const Comp = {
        setup(props, { attrs }) {
          const count = ref(1)
          return {
            count,
          }
        },
        render() {
          return h('div', [
            h('p', '我是父组件'),
            h(child, {
              onFoo: (a, b, c) => {
                console.log('foo', a, b, c)
              },
            }),
          ])
        },
      }

      const app = createApp(Comp, {
        test: 1,
        style: { border: '1px solid green' },
      })
      app.mount('#app')
    </script>
  </body>
</html>

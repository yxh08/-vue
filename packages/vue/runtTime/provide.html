<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>provide</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // import {
      //   h,
      //   ref,
      //   render,
      //   createApp,
      //   onMounted,
      // } from '../../../node_modules/vue/dist/vue.esm-browser.js'
      import {
        createApp,
        renderOptions,
        createRenderer,
        render,
        h,
        getCurrentInstance,
        ref,
        Text,
        onBeforeMount,
        onMounted,
        onBeforeUpdate,
        onUpdated,
        onBeforeUnmount,
        onUnmounted,
        provide,
        inject,
        useTemplateRef,
      } from '../dist/vue.esm.js'

      const Child1 = {
        name: 'Child1',
        setup() {
          const count = inject('count', 'defaultValue')
          return () => {
            return h('div', null, `状态组件:${count.value}`)
          }
        },
      }

      const App = {
        name: 'App',
        setup() {
          const count = ref(0)
          // provide('count', count)
          return () =>
            h(
              'div',
              {
                onClick: () => {
                  count.value++
                },
              },
              [h('div', null, '元素组件'), h(Child1)],
            )
        },
      }

      const app = createApp(App)
      app.mount('#app')
    </script>
  </body>
</html>
